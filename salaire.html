<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salaire net / brut - FinanceTool</title>
  <meta name="description" content="Convertisseur salaire brut en net rapidement.">

  <style>
    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      margin:0;
      padding:20px;
    }

    .box{
      max-width:500px;
      margin:auto;
      background:#1e293b;
      padding:20px;
      border-radius:10px;
    }

    input, button{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    button{
      background:#3b82f6;
      color:white;
      border:none;
      cursor:pointer;
    }

    .result{
      margin-top:20px;
      font-size:18px;
    }

    a{
      color:#60a5fa;
      display:block;
      margin-top:15px;
    }
  </style>
</head>

<body>

<div class="box">

<h1>Salaire brut → net</h1>

<input type="number" id="brut" placeholder="Salaire brut mensuel">

<button onclick="calc()">Calculer</button>

<div class="result" id="res"></div>

<a href="index.html">← Accueil</a>

</div>

<script>
function calc(){
  let b = parseFloat(document.getElementById("brut").value);

  if(!b){
    document.getElementById("res").innerHTML = "Valeur invalide";
    return;
  }

  let net = b * 0.78;

  document.getElementById("res").innerHTML =
    "Salaire net estimé : " + net.toFixed(2) + " €";
}
</script>

</body>
</html>
