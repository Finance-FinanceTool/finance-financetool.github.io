<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de crédit - FinanceTool</title>
  <meta name="description" content="Calculez vos mensualités de crédit facilement : prêt immobilier, auto ou personnel.">

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:600px;
      margin:auto;
      background:#1e293b;
      padding:20px;
      border-radius:10px;
    }

    input, button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:5px;
      border:none;
    }

    button{
      background:#3b82f6;
      color:white;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }

    .result{
      margin-top:20px;
      font-size:18px;
    }

    a{
      color:#60a5fa;
      display:block;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Calculateur de crédit</h1>

  <input type="number" id="montant" placeholder="Montant du prêt (€)">
  <input type="number" id="taux" placeholder="Taux annuel (%)">
  <input type="number" id="duree" placeholder="Durée (années)">

  <button onclick="calculer()">Calculer</button>

  <div class="result" id="result"></div>

  <a href="index.html">← Retour à l'accueil</a>

</div>

<script>
function calculer(){
  let m = parseFloat(document.getElementById("montant").value);
  let t = parseFloat(document.getElementById("taux").value) / 100 / 12;
  let n = parseFloat(document.getElementById("duree").value) * 12;

  if(!m || !t || !n){
    document.getElementById("result").innerHTML = "Valeurs invalides";
    return;
  }

  let mensualite = (m * t) / (1 - Math.pow(1 + t, -n));

  document.getElementById("result").innerHTML =
    "Mensualité estimée : " + mensualite.toFixed(2) + " €";
}
</script>

</body>
</html>
