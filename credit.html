<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crédit immobilier - calcul mensualité</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">

<div style="max-width:500px;margin:auto;background:#1e293b;padding:20px;border-radius:10px;">

<h1>Crédit immobilier</h1>

<input id="m" type="number" placeholder="Montant (€)">
<input id="t" type="number" placeholder="Taux annuel (%)">
<input id="a" type="number" placeholder="Années">

<button onclick="calc()" style="width:100%;padding:10px;margin-top:10px;">Calculer</button>

<div id="r" style="margin-top:20px;"></div>

<a href="index.html" style="color:#60a5fa;">Accueil</a>

</div>

<script>
function calc(){
let m=document.getElementById("m").value;
let t=document.getElementById("t").value/100/12;
let a=document.getElementById("a").value*12;

let x=(m*t)/(1-Math.pow(1+t,-a));

document.getElementById("r").innerHTML="Mensualité : "+x.toFixed(2)+" €";
}
</script>

</body>
</html>
